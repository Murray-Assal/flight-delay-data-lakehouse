name: flight-delay-lakehouse

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-iceberg_catalog}
      METABASE_DB_NAME: ${METABASE_DB_NAME:-metabase}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-a-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-a-local-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-flight-lakehouse}
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing "local/$${MINIO_BUCKET}"'

  trino:
    image: trinodb/trino:483
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-iceberg_catalog}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-a-local-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-flight-lakehouse}
    entrypoint: ["/bin/sh", "-ec"]
    command:
    - |
      cat > /etc/trino/catalog/iceberg.properties <<EOF
      connector.name=iceberg
      iceberg.catalog.type=jdbc
      iceberg.jdbc-catalog.catalog-name=lakehouse
      iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
      iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/$${POSTGRES_DB}
      iceberg.jdbc-catalog.connection-user=$${POSTGRES_USER}
      iceberg.jdbc-catalog.connection-password=$${POSTGRES_PASSWORD}
      iceberg.jdbc-catalog.default-warehouse-dir=s3://$${MINIO_BUCKET}/warehouse
      iceberg.jdbc-catalog.schema-version=V1

      fs.s3.enabled=true
      s3.endpoint=http://minio:9000
      s3.region=us-east-1
      s3.path-style-access=true
      s3.aws-access-key=$${MINIO_ROOT_USER}
      s3.aws-secret-key=$${MINIO_ROOT_PASSWORD}
      EOF
      exec /usr/lib/trino/bin/run-trino
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/v1/info > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  metabase:
    image: metabase/metabase:v0.56.17.x
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabase}
      MB_DB_USER: ${POSTGRES_USER:-iceberg}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-replace-with-a-local-password}
      MB_JETTY_PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  spark:
    image: spark:3.5.8-python3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceberg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-local-password}
      POSTGRES_DB: ${POSTGRES_DB:-iceberg_catalog}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-replace-with-a-local-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-flight-lakehouse}
      ICEBERG_CATALOG_NAME: lakehouse
      ICEBERG_CATALOG_URI: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-iceberg_catalog}
      ICEBERG_WAREHOUSE: s3://${MINIO_BUCKET:-flight-lakehouse}/warehouse
      MINIO_ENDPOINT: http://minio:9000
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      AVIATIONSTACK_BASE_URL: ${AVIATIONSTACK_BASE_URL:-http://api.aviationstack.com/v1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PYTHONPATH: /opt/flight-lakehouse/src
    volumes:
      - ./jobs:/opt/flight-lakehouse/jobs:ro
      - ./src:/opt/flight-lakehouse/src:ro
      - ./data:/opt/flight-lakehouse/data:ro
    working_dir: /opt/flight-lakehouse
    entrypoint: ["/opt/spark/bin/spark-submit"]

volumes:
  minio-data:
  postgres-data:
