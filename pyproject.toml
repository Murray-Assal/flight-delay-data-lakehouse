[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay-lakehouse"
version = "0.1.0"
description = "A local Apache Iceberg lakehouse for flight delay analytics."
readme = "readme.md"
requires-python = ">=3.10,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
